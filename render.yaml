# Configuración de despliegue en Render (https://render.com)
services:
  - type: web
    name: iris-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
